version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailpilot
      POSTGRES_PASSWORD: mailpilot_password
      POSTGRES_DB: mailpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailpilot -d mailpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailpilot-api
    restart: unless-stopped
    environment:
      PORT: 5050
      NODE_ENV: production
      DATABASE_URL: postgresql://mailpilot:mailpilot_password@postgres:5432/mailpilot?schema=public
      JWT_SECRET: super_secure_production_jwt_secret_change_me_12345
      CLIENT_URL: http://localhost:5173
      APP_URL: http://localhost:5173
      API_URL: http://localhost:5050
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
