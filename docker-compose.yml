version: '3.8'

# ─── MailPilot Docker Compose ─────────────────────────────────────────────────
# All secrets are injected from environment variables or a local .env.docker file.
# Copy .env.docker.example → .env.docker and fill in real values before running.
# Usage: docker compose --env-file .env.docker up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mailpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailpilot} -d ${POSTGRES_DB:-mailpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailpilot-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: 5050
      NODE_ENV: production
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
