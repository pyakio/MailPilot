<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_tmpl_08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131D2D" />
      <stop offset="100%" stop-color="#0F1318" />
    </linearGradient>
    <linearGradient id="accentGrad_tmpl_08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#3B82F6CC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" rx="12" fill="url(#bgGrad_tmpl_08)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="80" y1="0" x2="80" y2="240" />
    <line x1="160" y1="0" x2="160" y2="240" />
    <line x1="240" y1="0" x2="240" y2="240" />
    <line x1="320" y1="0" x2="320" y2="240" />
  </g>

  <!-- Inner Email Document Frame -->
  <rect x="24" y="20" width="352" height="200" rx="8" fill="#1C2128" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#cardShadow)" />
  
  <!-- Email Top Window Bar -->
  <rect x="24" y="20" width="352" height="28" rx="8" fill="#16191E" />
  <circle cx="42" cy="34" r="3.5" fill="#EF4444" opacity="0.8"/>
  <circle cx="54" cy="34" r="3.5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="66" cy="34" r="3.5" fill="#10B981" opacity="0.8"/>
  
  <!-- Subject / Category Badge -->
  <rect x="250" y="25" width="114" height="18" rx="4" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-opacity="0.3" />
  <text x="307" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#3B82F6" text-anchor="middle" letter-spacing="0.5">ANNUAL EVENT</text>

  <!-- Email Body Content Mockup -->
  <!-- Left Icon Area -->
  <rect x="42" y="60" width="40" height="40" rx="8" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-opacity="0.4" />
  <text x="62" y="86" font-family="sans-serif" font-size="20" text-anchor="middle">🎪</text>

  <!-- Title & Headline -->
  <text x="94" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">MailPilot Summit 2026</text>
  <text x="94" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">MailPilot Production Email Template</text>

  <!-- Content Bullet Lines -->
  <g transform="translate(42, 114)">
    <circle cx="4" cy="4" r="2.5" fill="#3B82F6" />
    <text x="14" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#CBD5E1">2,500+ SaaS Founders</text>
    
    <circle cx="4" cy="22" r="2.5" fill="#3B82F6" />
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#CBD5E1">Keynotes & Workshops</text>
    
    <circle cx="4" cy="40" r="2.5" fill="#3B82F6" />
    <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#CBD5E1">Early Bird Pass Open</text>
  </g>

  <!-- Action CTA Button in Email -->
  <rect x="42" y="174" width="130" height="28" rx="6" fill="url(#accentGrad_tmpl_08)" />
  <text x="107" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#14171C" text-anchor="middle">Get Early Pass →</text>

  <!-- Sender Signature Stamp -->
  <text x="360" y="192" font-family="monospace" font-size="9" fill="#64748B" text-anchor="end">MailPilot ESP 2.0</text>
</svg>